name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel a superseded run on the same ref: a queued CI for an older commit
# tells us nothing once a newer one is running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The coact revision this product builds against, pinned to a COMMIT rather than
# a branch. xcom_core needs the windows branch specifically (it carries the Win32
# PAL), but a branch is a moving target: the same commit here would build against
# different coact bytes tomorrow, and a coact change that silently drops a
# capability xcom_core relies on - the High critical reserve in XcomCoactConfig
# is one - would pass review unnoticed because the source of the regression is
# not in this repository.
#
# Bump deliberately: change the commit below, run CI, and say in the commit
# message which coact change is being taken. Keep it a full 40-character SHA so
# the pin is unambiguous.
env:
  COACT_REF: 6bbb094d6b997df5d06e9cb702bbffb88cb664a5

jobs:
  # ---------------------------------------------------------------------------
  # Pure-Lua suites. These need no DLL, no serial hardware and no Windows: the
  # modules under test (view_model, charset, xcom_ffi's layout pins, the script
  # plugins, ...) are plain Lua 5.1 and are deliberately written to be runnable
  # anywhere. This is the fast, always-meaningful gate.
  # ---------------------------------------------------------------------------
  lua-tests:
    name: Lua tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The project pins LuaJIT through OpenResty's build, which is what the
      # Windows runtime (runtime/luvjit.exe) is based on. Matching it here keeps
      # bytecode and FFI semantics identical between CI and the shipped binary.
      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends luajit lua-cjson

      - name: Select interpreter
        id: lj
        # Prefer the OpenResty layout when a dev machine clones with it present,
        # otherwise fall back to the distro luajit.
        run: |
          if [ -x "$HOME/.local/openresty/luajit/bin/luajit" ]; then
            echo "bin=$HOME/.local/openresty/luajit/bin/luajit" >> "$GITHUB_OUTPUT"
          else
            echo "bin=luajit" >> "$GITHUB_OUTPUT"
          fi

      - name: Run portable Lua suites
        working-directory: xcom_lua
        run: |
          set -u
          LUAI="${{ steps.lj.outputs.bin }}"
          "$LUAI" -v
          # Every file listed here must pass on a machine with no Windows DLL
          # and no serial port. Tests needing luv / xcom_core.dll / hardware are
          # intentionally absent — they run in the Windows job or not at all.
          # Suites that stub luv through package.preload DO qualify and belong
          # here: a suite is only excluded when it actually requires a host
          # facility, not when it merely exercises host-facing code.
          SUITES="
            test_ansi
            test_charset
            test_config
            test_device_profiles
            test_event_delivery
            test_log_save_report
            test_multi_send
            test_open_line_tristate
            test_port_enum
            test_receive_copy
            test_reconnect_known_peers
            test_reconnect_port
            test_reset_overlay
            test_reset_sequencer
            test_rx_charset_batch
            test_rx_display_caps
            test_rx_display_pipeline
            test_script_budget
            test_script_meta
            test_send_file_retry
            test_shipped_scripts
            test_view_model
            test_wave_ring
            test_xcom_ffi
          "
          fail=0
          for t in $SUITES; do
            if [ ! -f "tests/$t.lua" ]; then
              echo "::error::missing suite tests/$t.lua"
              fail=1
              continue
            fi
            # Trust the suite's own exit status (each ends with
            # os.exit(failed == 0 and 0 or 1)) rather than scraping the summary
            # line, and log the full output so a failure is diagnosable here.
            echo "----- $t -----"
            if "$LUAI" "tests/$t.lua"; then
              echo "OK: $t"
            else
              echo "::error::$t failed"
              fail=1
            fi
          done
          exit $fail

      - name: Lint for accidental globals
        working-directory: xcom_lua
        # A read of a name that is never declared local is almost always a typo
        # or a forward reference whose declaration lost its hoist.  One such
        # case shipped here: three frame-pacing constants were declared ~1400
        # lines below their first call sites, so those sites read nil globals
        # and the receive cadence silently ran at the interactive interval
        # instead of the coalesced one — a CPU regression no suite caught.
        # This step is what makes that class of defect fail the build.
        run: |
          "${{ steps.lj.outputs.bin }}" tests/lint_fields.lua

  # ---------------------------------------------------------------------------
  # Native core + ImGui bridge. CMakeLists.txt hard-requires WIN32 (the serial
  # backend is Win32-native and the front-end is DirectX 11), so this job can
  # only run on Windows.
  # ---------------------------------------------------------------------------
  native:
    name: Native build + C++ tests (Windows)
    runs-on: windows-latest
    env:
      # xcom_core is built against the coact framework from its own repository —
      # the vendored copy under xcom_core/framework/ was removed. COACT_REF must
      # resolve to a commit on coact's `windows` branch, which is the one carrying
      # the Win32 platform layer (pal_windows.hpp).
      # The default resolution would look one level ABOVE this checkout
      # (xcom_core/../../coact), so point at the sibling path explicitly.
      XCOM_COACT_ROOT: ${{ github.workspace }}/coact
    steps:
      - uses: actions/checkout@v4

      - name: Check out coact at the pinned revision
        uses: actions/checkout@v4
        with:
          repository: DeguiLiu/coact
          ref: ${{ env.COACT_REF }}
          path: coact

      - name: Configure
        # No -G/-A: the runner image ships a moving VS version, and pinning
        # "Visual Studio 17 2022" fails once the image moves on. Let CMake pick
        # whatever MSVC the image provides.
        run: cmake -S . -B build -DBUILD_TESTING=ON -DXCOM_COACT_ROOT="${{ github.workspace }}/coact"

      # The ImGui front-end DLL has its own CMakeLists and is NOT referenced by
      # the root one, so it would otherwise go untested — and it is where the
      # footer render, the plugin windows and the scope panel live. Now that
      # third_party/xcom_imgui/implot is vendored (it was excluded by
      # .gitignore, which left this DLL unbuildable from a fresh clone), the
      # build is a real gate rather than a reported gap.
      - name: Configure ImGui front-end
        run: cmake -S xcom_lua/native/xcom_imgui -B build-imgui

      - name: Build ImGui front-end
        run: cmake --build build-imgui --config Release --parallel

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run C++ tests
        working-directory: build
        run: ctest -C Release --output-on-failure

  # ---------------------------------------------------------------------------
  # Static guard: the FFI cdef in xcom_ffi.lua pins sizeof() for every ABI
  # struct, and the C header is authoritative. Drift between them silently
  # corrupts every field read after the change, so check the pins explicitly
  # rather than relying on a suite that might get skipped.
  # ---------------------------------------------------------------------------
  abi-layout:
    name: ABI layout pins (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends luajit
      - name: Verify struct size pins
        working-directory: xcom_lua
        # require() runs the module-load assertion, which compares ffi.sizeof
        # against the pinned table for every cdef'd struct and errors on drift,
        # so a mismatch fails this step instead of silently misreading fields.
        # The module lives in core/, hence the explicit package.path.
        run: |
          luajit -e 'package.path = "./core/?.lua;" .. package.path; require("xcom_ffi"); print("ABI layout pins OK")'

  # ---------------------------------------------------------------------------
  # C++ syntax gate. The authoritative build is MSVC on Windows (the job above),
  # but a Windows runner is slow and unavailable offline, so a compiler-level
  # parse of the serial/ABI sources also runs here against a minimal windows.h
  # stand-in (tools/win32-stub). This catches syntax, type and missing-declaration
  # errors within seconds. It is a supplement to, never a replacement for, the
  # real build — see the script's header for what it cannot model.
  # ---------------------------------------------------------------------------
  cpp-syntax:
    name: C++ syntax check (Linux + win32 stub)
    runs-on: ubuntu-latest
    env:
      # Same reason as the native job: the vendored coact tree is gone, and the
      # script's default would resolve one level above this checkout.
      XCOM_COACT_ROOT: ${{ github.workspace }}/coact
    steps:
      - uses: actions/checkout@v4

      - name: Check out coact at the pinned revision
        uses: actions/checkout@v4
        with:
          repository: DeguiLiu/coact
          ref: ${{ env.COACT_REF }}
          path: coact

      - name: Parse serial / ABI translation units
        run: tools/check_cpp_syntax.sh
